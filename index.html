}
#bgVeil{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(78% 46% at 50% 34%, rgba(150,190,255,.10), transparent 70%),
    linear-gradient(180deg, rgba(4,8,16,.55) 0%, rgba(4,8,16,.06) 26%, rgba(4,8,16,.10) 62%, rgba(4,8,16,.72) 100%);
}
#snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}

/* ================= 通用场景 ================= */
.scene{
  position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .85s ease, transform .85s cubic-bezier(.22,.9,.25,1);
  transform:scale(.985);
}
.scene.on{opacity:1;transform:scale(1)}
#s5.on{pointer-events:auto}
.scene.out{opacity:0;transform:scale(1.03)}

/* ================= 1. 开场 ================= */
#s1{padding:0 12rem;transition:opacity .8s ease, transform .9s cubic-bezier(.22,.9,.25,1), filter .8s ease}
#s1.dim{opacity:.16;transform:scale(.972);filter:blur(.5rem)}
.s1-top{
  font-size:2.6rem;letter-spacing:.42em;color:rgba(214,232,255,.70);
  margin-bottom:8.5rem;font-weight:300;text-indent:.42em;
  opacity:0;transform:translateY(1.4rem);
  transition:all 1.9s cubic-bezier(.22,.9,.25,1) .5s;
}
.s1-title{text-align:center;opacity:0;transform:translateY(2.4rem) scale(.985);
  transition:all 2.5s cubic-bezier(.22,.9,.25,1) 1.1s;}
.s1-title span{
  display:block;
  font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","SimSun",serif;
  font-size:15.6rem;line-height:1.4;font-weight:300;letter-spacing:.11em;
  text-indent:.11em;
  color:#f4f9ff;
  text-shadow:0 0 2.4rem rgba(170,210,255,.55),0 0 7rem rgba(120,170,255,.42),0 .4rem 1.6rem rgba(0,0,0,.55);
}
.s1-line{
  width:0;height:1px;margin:7.5rem 0 5.6rem;
  background:linear-gradient(90deg,transparent,rgba(190,218,255,.75),transparent);
  transition:width 2.2s cubic-bezier(.22,.9,.25,1) 2.1s;
}
.s1-sub{
  font-size:2.7rem;line-height:2.15;letter-spacing:.28em;text-indent:.28em;
  color:rgba(206,226,255,.72);text-align:center;font-weight:300;
  opacity:0;transform:translateY(1.2rem);
  transition:all 1.9s ease 2.7s;
}
#s1.on .s1-top,#s1.on .s1-title,#s1.on .s1-sub{opacity:1;transform:none}
#s1.on .s1-line{width:46rem}
.s1-tip{
  position:absolute;left:0;right:0;bottom:14rem;text-align:center;
  font-size:2.2rem;letter-spacing:.5em;text-indent:.5em;
  color:rgba(206,226,255,.62);
  animation:breathe 2.8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.85}}

/* ================= 2. 立冬弹窗 ================= */
#dlg{
  position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;
  padding:0 10rem;opacity:0;pointer-events:none;
  transition:opacity .55s ease;
}
#dlg.on{opacity:1;pointer-events:auto}
#dlg .veil{
  position:absolute;inset:0;background:rgba(3,7,14,.52);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.card{
  position:relative;
  width:80rem;padding:8.6rem 6.6rem 7.2rem;border-radius:6rem;
  background:linear-gradient(158deg,rgba(30,44,66,.72),rgba(18,28,44,.80) 58%,rgba(34,50,74,.72));
  border:1px solid rgba(210,230,255,.34);
  box-shadow:
    0 3.2rem 7rem rgba(2,6,14,.62),
    0 0 0 .1rem rgba(255,255,255,.10) inset,
    0 2.2rem 4rem rgba(150,195,255,.13) inset;
  backdrop-filter:blur(2.2rem) saturate(1.3);
  -webkit-backdrop-filter:blur(2.2rem) saturate(1.3);
  text-align:center;
  transform:translateY(4rem) scale(.9);opacity:0;
  transition:transform .8s cubic-bezier(.16,1.05,.3,1), opacity .6s ease;
}
#dlg.on .card{transform:none;opacity:1}
.card .ic{
  font-size:7rem;line-height:1;margin-bottom:3.2rem;
  filter:drop-shadow(0 0 2.4rem rgba(170,215,255,.85));
  animation:spin 9s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.card .t{
  font-size:5.15rem;line-height:1.74;font-weight:400;letter-spacing:.06em;
  color:#f2f8ff;text-shadow:0 0 2rem rgba(160,200,255,.42);
}
.card .t em{font-style:normal;color:#ffe2b0;text-shadow:0 0 2rem rgba(255,206,140,.6)}
.card .btn{
  margin-top:6.4rem;display:inline-block;
  padding:3.5rem 10rem;border:0;border-radius:20rem;
  font-family:inherit;font-size:4.5rem;font-weight:600;letter-spacing:.14em;text-indent:.14em;
  color:#0d1c30;cursor:pointer;
  background:linear-gradient(140deg,#ffffff,#dbe9fb 46%,#b9d3f2);
  box-shadow:0 1.6rem 3.4rem rgba(120,170,255,.34),0 .3rem 0 rgba(255,255,255,.85) inset;
  transition:transform .16s ease, box-shadow .3s ease;
  position:relative;overflow:hidden;
}
.card .btn:active{transform:scale(.955);box-shadow:0 1rem 2rem rgba(120,170,255,.3)}
.card .btn::after{
  content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(110deg,transparent 32%,rgba(255,255,255,.85) 48%,transparent 64%);
  transform:translateX(-120%);
  animation:sheen 3.4s ease-in-out infinite;
}
@keyframes sheen{0%,62%{transform:translateX(-120%)}86%,100%{transform:translateX(120%)}}

/* ================= 3. 爱心卡片 ================= */
#heartLayer{position:absolute;inset:0;z-index:6;pointer-events:none}
.pop{
  position:absolute;left:0;top:0;width:14.2rem;height:10.3rem;
  border-radius:1.7rem;
  background:linear-gradient(158deg,#ffffff 0%,#f2f7ff 42%,#dfeaf9 100%);
  box-shadow:
    0 .7rem 1.9rem rgba(4,10,20,.42),
    0 0 0 .32rem rgba(255,255,255,.55) inset,
    0 0 1.6rem rgba(190,220,255,.30);
  will-change:transform,opacity;
  transform-origin:50% 50%;
  opacity:0;
  backface-visibility:hidden;
}
.pop.c1{background:linear-gradient(158deg,#ffffff,#f0f7ff 42%,#dbeaff)}
.pop.c2{background:linear-gradient(158deg,#ffffff,#faf5ff 42%,#ecdffb)}
.pop.c3{background:linear-gradient(158deg,#ffffff,#f2fdfa 42%,#d9f0e6)}
.pop.c4{background:linear-gradient(158deg,#ffffff,#fffaf0 42%,#fbecd2)}
.pop .dots{position:absolute;left:1.5rem;top:1.4rem;display:flex;gap:.62rem}
.pop .dots i{width:.86rem;height:.86rem;border-radius:50%;background:#c9d8ea;display:block}
.pop .dots i:nth-child(1){background:#e7b6b6}

<script>
(function(){
"use strict";
var $ = function(s){ return document.querySelector(s); };
var stage = $('#stage');
var isTouch = ('ontouchstart' in window);

/* ---------- 尺寸：1rem = 舞台宽/100 ---------- */
function fit(){
  var w = stage.getBoundingClientRect().width || window.innerWidth;
  document.documentElement.style.fontSize = (w/100) + 'px';
}
fit();
window.addEventListener('resize', function(){ fit(); sizeSnow(); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ fit(); sizeSnow(); }, 180); });

/* ---------- 雪 ---------- */
var cv = $('#snow'), ctx = cv.getContext('2d');
var SW = 0, SH = 0, DPR = 1, flakes = [], snowRaf = null, snowOn = true;
function sizeSnow(){
  var r = stage.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = r.width; SH = r.height;
  cv.width = Math.round(SW*DPR); cv.height = Math.round(SH*DPR);
  cv.style.width = SW+'px'; cv.style.height = SH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  buildFlakes();
}
function buildFlakes(){
  var u = SW/100, n = Math.round(SW*SH/9500);
  n = Math.max(40, Math.min(150, n));
  flakes = [];
  for(var i=0;i<n;i++){
    flakes.push({
      x: Math.random()*SW,
      y: Math.random()*SH,
      r: u*(0.30 + Math.random()*0.58),
      vy: u*(0.020 + Math.random()*0.030),
      vx: u*(Math.random()-0.5)*0.014,
      a: 0.28 + Math.random()*0.55,
      ph: Math.random()*Math.PI*2,
      sp: 0.4 + Math.random()*1.1
    });
  }
}
function snowFrame(t){
  if(!snowOn){ snowRaf = null; return; }
  ctx.clearRect(0,0,SW,SH);
  var u = SW/100;
  for(var i=0;i<flakes.length;i++){
    var f = flakes[i];
    f.y += f.vy; f.x += f.vx + Math.sin(t/1600*f.sp + f.ph)*u*0.010;
    if(f.y > SH + u*2){ f.y = -u*2; f.x = Math.random()*SW; }
    if(f.x < -u*2) f.x = SW + u*2;
    if(f.x > SW + u*2) f.x = -u*2;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, 6.2832);
    ctx.fillStyle = 'rgba(228,240,255,'+f.a+')';
    ctx.fill();
  }
  snowRaf = requestAnimationFrame(snowFrame);
}
sizeSnow();
snowRaf = requestAnimationFrame(snowFrame);

/* ---------- 时间线工具 ---------- */
var timers = [];
function after(ms, fn){ var id = setTimeout(fn, ms); timers.push(id); return id; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

/* ---------- 1 开场 ---------- */
after(120, function(){ $('#s1').classList.add('on'); });
after(4800, function(){
  var tip = document.querySelector('.s1-tip');
  if(tip) tip.style.transition='opacity .5s', tip.style.opacity='0';
  $('#s1').classList.add('dim');
  $('#dlg').classList.add('on');
});

/* ---------- 2 点击进入 ---------- */
var started = false;
$('#go').addEventListener('click', function(e){
  e.stopPropagation();
  if(started) return; started = true;
  $('#dlg').classList.remove('on');
  var s1 = $('#s1');
  s1.classList.add('out');
  after(500, function(){ s1.classList.remove('on','out'); s1.style.display='none'; });
  after(420, startHeart);
});

/* ---------- 3 爱心卡片 ---------- */
var N = 58;
var heartLayer = $('#heartLayer');
var cards = [];
var bigCard = null;

function heartPoints(n, R){
  var M = 2000, pts = [], cum = [0], i, t, x, y;
  for(i=0;i<=M;i++){
    t = i/M*Math.PI*2;
    x = 16*Math.pow(Math.sin(t),3);
    y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    pts.push([x*R, -y*R]);
  }
  for(i=1;i<=M;i++){
    cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  }
  var total = cum[M], out = [], k, target, lo, hi, mid;
  for(k=0;k<n;k++){
    target = total*k/n;
    lo = 0; hi = M;
    while(lo < hi){ mid = (lo+hi)>>1; if(cum[mid] < target) lo = mid+1; else hi = mid; }
    i = Math.max(1, lo);
    out.push({x:pts[i][0], y:pts[i][1]});
  }
  for(k=0;k<n;k++){
    var a = out[(k-1+n)%n], b = out[(k+1)%n];
    out[k].ang = Math.atan2(b.y-a.y, b.x-a.x) * 180/Math.PI;
  }
  return out;
}

function startHeart(){
  var w = stage.clientWidth, h = stage.clientHeight, u = w/100;
  var R = 2.16*u;
  var cx = w/2, cy = h*0.468;
  var pts = heartPoints(N, R);
  var spots = [];
  for(var i=0;i<N;i++){
    var sx = w*(0.07 + Math.random()*0.86);
    var sy = h*(0.07 + Math.random()*0.84);
    spots.push({x:sx, y:sy, rot:(Math.random()-0.5)*44});
  }

  cards = [];
  for(var i=0;i<N;i++){
    var d = document.createElement('div');
    d.className = 'pop c' + [1,1,1,2,2,3,4,4,1,2][i%10];
    d.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>' +
                  '<span class="px">×</span>' +
                  '<span class="ph">♡</span>' +
                  '<span class="pbar"></span>';
    var sp = spots[i];
    d.style.transform = 'translate(' + (sp.x) + 'px,' + (sp.y) + 'px) translate(-50%,-50%) rotate(' + sp.rot + 'deg) scale(.2)';
    d.style.opacity = '0';
    d.style.zIndex = String(10 + i);
    heartLayer.appendChild(d);
    cards.push({el:d, spot:sp, pt:pts[i]});
  }

  /* 逐个弹出 */
  for(var j=0;j<N;j++){
    (function(k){
      after(k*46, function(){
        var c = cards[k];
        c.el.style.transition = 'transform .62s cubic-bezier(.16,1.2,.32,1), opacity .34s ease';
        c.el.style.opacity = '1';
        c.el.style.transform = 'translate(' + c.spot.x + 'px,' + c.spot.y + 'px) translate(-50%,-50%) rotate(' + c.spot.rot + 'deg) scale(1)';
      });
    })(j);
  }

  /* 汇聚成心 */
  var tMerge = N*46 + 380;
  after(tMerge, function(){
    for(var k=0;k<N;k++){
      var c = cards[k];
      var tx = cx + c.pt.x, ty = cy + c.pt.y;
      c.el.style.transition = 'transform 1.08s cubic-bezier(.34,.86,.24,1) ' + (k*4) + 'ms';
      c.el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%) rotate(' + c.pt.ang + 'deg) scale(1)';
    }
  });

  /* 收拢：更密实，像一叠纸 */
  var tTight = tMerge + 1180;
  after(tTight, function(){
    for(var k=0;k<N;k++){
      var c = cards[k];
      var tx = cx + c.pt.x*0.985, ty = cy + c.pt.y*0.985;
      c.el.style.transition = 'transform .8s cubic-bezier(.3,.9,.3,1) ' + (k*3) + 'ms';
      c.el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%) rotate(' +
        (c.pt.ang + (k%2 ? 1.6 : -1.6)) + 'deg) scale(.995)';
    }
  });

  /* 中间大卡 */
  after(tTight + 900, function(){
    bigCard = document.createElement('div');
    bigCard.id = 'bigCard';
    bigCard.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="px">×</span><span class="ph">♡</span><span>立冬快乐</span>';
    bigCard.style.top = (cy - 13*u) + 'px';
    heartLayer.appendChild(bigCard);
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ bigCard.classList.add('on'); }); });
  });

  /* 心跳 */
  after(tTight + 900, function(){
    heartLayer.style.transition = 'transform .5s cubic-bezier(.3,.9,.3,1)';
    heartLayer.style.transformOrigin = '50% 45%';
    heartLayer.style.transform = 'scale(1.032)';
    after(320, function(){ heartLayer.style.transform = 'scale(1)'; });
    after(680, function(){ heartLayer.style.transform = 'scale(1.022)'; });
    after(980, function(){ heartLayer.style.transform = 'scale(1)'; });
  });

  /* 进入九宫格 */
  after(tTight + 3050, function(){
    heartLayer.style.transition = 'opacity .9s ease, transform .9s ease';
    heartLayer.style.opacity = '0';
    heartLayer.style.transform = 'scale(1.06)';
    after(700, function(){ heartLayer.innerHTML = ''; heartLayer.style.opacity=''; heartLayer.style.transform=''; });
    enterGrid();
  });
}

var GOODS = [

];
function enterGrid(){
  var g = $('#grid'), s3 = $('#s3');
  g.innerHTML = '';
  s3.classList.add('on');
  for(var i=0;i<GOODS.length;i++){
    var c = document.createElement('div');

  '今天是2026年11月7日 周六',
  '时序步入立冬啦',
  '天气要越来越冷了哦子钦',
  '',

];
function enterLetter(){
  var s4 = $('#s4');
  s4.classList.add('on');
  after(560, function(){
    var el = $('#ptxt');
    el.innerHTML = '';
    var txt = document.createTextNode('');
    var cur = document.createElement('span');
    cur.className = 'cur'; cur.textContent = '\uFF5C';
    el.appendChild(txt); el.appendChild(cur);
    var full = LETTER.join('\n'), i = 0;
    (function step(){
      if(i >= full.length){
        setTimeout(function(){ cur.remove(); }, 700);
        $('#psign').classList.add('on');
        after(1500, function(){
          s4.classList.add('out');
          after(760, function(){ s4.classList.remove('on','out'); enterGift(); });
        });
        return;
      }
      var ch = full.charAt(i++);
      txt.data += ch;
      var d = 34;
      if(ch === '\n') d = 230;
      else if(ch === ' ') d = 70;
      after(d, step);
    })();
  });
}

/* ---------- 6 礼物盒 ---------- */
var giftOpened = false;
function enterGift(){
  var s5 = $('#s5');
  s5.classList.add('on');
  var box = $('#giftBox');
  box.addEventListener('click', function(e){ e.stopPropagation(); openGift(); });
  s5.addEventListener('click', function(){ openGift(); });
}
function openGift(){
  if(giftOpened) return;
  giftOpened = true;
  var box = $('#giftBox');
  box.classList.add('open');
  var hint = $('#giftHint');
  hint.style.transition = 'opacity .4s ease';
  hint.style.opacity = '0';
  setTimeout(function(){ hint.style.display = 'none'; }, 450);
  setTimeout(function(){
    box.style.animation = 'none';
    box.style.transition = 'opacity .85s ease, transform 1s cubic-bezier(.4,0,.6,1)';
    box.style.opacity = '0';
    box.style.transform = 'scale(.7) translateY(-5rem)';
  }, 900);

  /* 光点绽放 */
  var r = box.getBoundingClientRect(), sr = stage.getBoundingClientRect();
  var ox = r.left - sr.left + r.width/2, oy = r.top - sr.top + r.height*0.34;
  var u = sr.width/100;
  for(var i=0;i<22;i++){
    (function(k){
      var p = document.createElement('i');
      var ang = (-90 + (Math.random()-0.5)*150) * Math.PI/180;
      var dist = u*(22 + Math.random()*34);
      var sz = u*(0.5 + Math.random()*1.1);
      p.style.cssText = 'position:absolute;left:'+ox+'px;top:'+oy+'px;width:'+sz+'rem;height:'+sz+'rem;'+
        'border-radius:50%;background:radial-gradient(circle,#fff,rgba(190,222,255,.35));'+
        'box-shadow:0 0 '+(sz*3)+'rem rgba(180,215,255,.9);pointer-events:none;z-index:8;'+
        'transition:transform 1.5s cubic-bezier(.16,.8,.32,1),opacity 1.5s ease;opacity:1;';
      stage.appendChild(p);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          p.style.transform = 'translate('+(Math.cos(ang)*dist)+'px,'+(Math.sin(ang)*dist)+'px) scale(.2)';
          p.style.opacity = '0';
        });
      });
      after(1700, function(){ p.remove(); });
    })(i);
  }

  after(460, function(){ $('#rings').classList.add('on'); });
  after(1650, function(){ $('#wish').classList.add('on'); });
}

})();
